# Render blueprint for the API (dashboard goes on Vercel). Render → New → Blueprint → pick this repo.
# Free plan: 512 MB RAM, sleeps after 15 min idle (first request then takes ~30-60 s), no persistent disk.
services:
  - type: web
    name: forkbot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # secrets: Render asks for these when the blueprint is created
      - key: DATABASE_URL          # Supabase session pooler URL (postgresql+psycopg://...)
        sync: false
      - key: GEMINI_API_KEY        # used for embeddings (free tier); not spent on chats while SERVER_LLM_KEYS=false
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY        # Fernet key for users' pasted API keys; keep it stable
        sync: false
      # settings
      - key: COOKIE_SECURE
        value: "true"
      - key: SERVER_LLM_KEYS       # users paste their own LLM keys in the bot settings tab
        value: "false"
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: STORAGE_BACKEND       # Render's disk is wiped on every deploy/restart: keep originals in Supabase Storage
        value: s3
      - key: S3_ENDPOINT           # https://<project-ref>.storage.supabase.co/storage/v1/s3
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        value: documents
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
