name: forkbot  # compose project (container, volume and network names)
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: forkbot
      POSTGRES_PASSWORD: forkbot
      POSTGRES_DB: forkbot
    ports: ["5433:5432"]   # 5433 so it won't clash with a local Postgres
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forkbot"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
